services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: prreview
      POSTGRES_PASSWORD: prreview
      POSTGRES_DB: prreview
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prreview"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata: