[project]
name = "pr-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.15.0",
    "arq>=0.28.0",
    "asyncpg>=0.32.0",
    "defusedxml>=0.7.1",
    "e2b>=2.59.0",
    "fastapi>=0.150.0",
    "githubkit>=0.16.1",
    "httpx>=0.28.1",
    "openai>=3.35.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pyjwt[crypto]>=2.15.1",
    "pyyaml>=6.0.3",
    "redis>=5.3.1",
    "sqlalchemy[asyncio]>=2.1.5",
    "structlog>=26.1.0",
    "unidiff>=1.0.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.5",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
# Real-E2B tests cost money: skipped by default, run with `uv run pytest -m sandbox`
addopts = "-m 'not sandbox'"
markers = ["sandbox: runs against a real E2B sandbox"]
